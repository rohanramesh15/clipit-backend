services:
  db:
    image: pgvector/pgvector:pg15
    container_name: deadbird-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-deadbird}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-deadbird}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./new-backend
      dockerfile: Dockerfile
    container_name: deadbird-backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-deadbird}
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./new-backend:/app # For live reloading during development (optional)
      - /app/__pycache__ # Don't sync pycache back to host
    env_file:
      - ./new-backend/.env

volumes:
  postgres_data:
