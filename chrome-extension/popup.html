<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ClipIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Love+Ya+Like+A+Sister&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── CSS Variables — matches the ClipIt web app's design tokens
       (clipit-frontend/src/index.css light theme; the app is light-only). ─── */
    :root {
      --bg-app: #ffffff;
      --bg-surface: #fffcf9;
      --bg-surface-hover: #eeeef1;
      --accent: #C4625A;
      --accent-hover: #A84F49;
      --accent-rgb: 196, 98, 90;
      --text-primary: #4c2323;
      --text-secondary: #7a3b3b;
      --text-muted: #986a6a;
      --border-subtle: #fcf6ed;
      --border-medium: rgba(76, 35, 35, 0.14);
      --overlay-bg: rgba(76, 35, 35, 0.35);
    }

    body {
      width: 380px;
      min-height: 120px;
      max-height: 560px;
      font-family: 'Segoe UI', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      background: var(--bg-app);
      color: var(--text-primary);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      max-height: 560px;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ─── Header ─────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
      background: var(--bg-app);
    }
    .header-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      margin-top: -1px;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 0;
    }
    .header-title {
      font-family: 'Love Ya Like A Sister', cursive;
      font-size: 26px;
      letter-spacing: -0.5px;
      -webkit-text-stroke: 1px #9E3B3B;
      paint-order: stroke fill;
      margin-top: 2px;
    }
    .header-title .lip { color: #EA7B7B; }
    .header-title .it { color: #C4625A; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
    }
    .status-dot.green { background: #22c55e; box-shadow: 0 0 6px #22c55e80; }
    .status-dot.red   { background: #ef4444; }
    .count-badge {
      font-size: 11px; font-weight: 600; color: var(--text-secondary);
    }
    .lang-badge {
      padding: 4px 8px;
      border-radius: 7px;
      background: var(--border-subtle);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.03em;
    }
    .back-btn {
      background: none; border: none; cursor: pointer;
      color: var(--accent); font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 4px; padding: 0;
    }
    .back-btn:hover { opacity: 0.8; }
    .detail-title {
      font-size: 12px; color: var(--text-secondary); flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      margin-left: 10px; text-align: right;
    }

    /* ─── Scrollable body ─────────────────────── */
    .body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--border-medium) transparent;
    }
    .body::-webkit-scrollbar { width: 4px; }
    .body::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 4px; }

    /* ─── Footer ─────────────────────────────── */
    .footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
      background: var(--bg-app);
    }
    .footer-btn {
      width: 100%; padding: 9px; border-radius: 10px;
      background: rgba(var(--accent-rgb),0.12); border: 1px solid rgba(var(--accent-rgb),0.24);
      color: var(--accent); font-size: 12px; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }
    .footer-btn:hover { background: rgba(var(--accent-rgb),0.2); }

    /* ─── Loading / Empty states ──────────────── */
    .center-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 36px 24px; gap: 10px;
      text-align: center;
    }
    .center-state .icon { font-size: 32px; opacity: 0.6; }
    .center-state .title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .center-state .sub { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

    .spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid rgba(var(--accent-rgb),0.22);
      border-top-color: var(--accent);
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Video list ──────────────────────────── */
    .video-list { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

    .video-card {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: 12px; padding: 10px; cursor: default;
      transition: border-color 0.15s;
    }
    .video-card:hover { border-color: var(--border-medium); }

    .video-thumb {
      width: 88px; height: 50px; border-radius: 7px;
      object-fit: cover; background: var(--bg-surface-hover); flex-shrink: 0;
      position: relative;
    }
    .video-thumb.netflix-thumb {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--bg-surface-hover) 0%, #f5e1dd 100%);
      border: 1px solid rgba(229, 9, 20, 0.2);
    }
    .platform-badge {
      position: absolute; top: 4px; left: 4px;
      width: 16px; height: 16px; border-radius: 4px;
      font-size: 9px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .platform-badge.youtube {
      background: #ff0000; color: white;
    }
    .platform-badge.netflix {
      background: #e50914; color: white;
    }
    .netflix-thumb .platform-badge {
      position: static; width: 28px; height: 28px;
      font-size: 14px; border-radius: 6px;
    }

    .video-meta { flex: 1; min-width: 0; }
    .video-title-text {
      font-size: 12px; font-weight: 500; color: var(--text-primary);
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
      line-height: 1.4;
    }
    .video-episode-info {
      font-size: 10px; font-weight: 600; color: var(--text-muted); margin-top: 2px;
    }
    .video-id-text { font-size: 10px; color: var(--text-muted); margin-top: 3px; }

    /* ─── Word cards ──────────────────────────── */
    .words-header {
      padding: 12px 16px 4px;
      font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em;
    }

    .words-list { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 6px; }

    .word-card {
      background: var(--bg-surface); border-radius: 12px;
      padding: 12px 14px; border-left: 3px solid rgba(var(--accent-rgb),0.6);
      transition: transform 0.1s;
    }
    .word-card:hover { transform: translateX(2px); }

    .word-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }

    .word-korean { font-size: 17px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }

    .word-rank {
      font-size: 10px; font-weight: 600; color: var(--text-muted);
      flex-shrink: 0;
    }

    .word-english { font-size: 13px; color: var(--text-secondary); font-weight: 500; margin-bottom: 5px; }

    .word-sentence {
      font-size: 11px; color: var(--text-muted); line-height: 1.5;
      border-top: 1px solid var(--border-subtle); padding-top: 6px; margin-top: 4px;
    }
    .word-sentence .ko { color: var(--text-secondary); }
    .word-sentence .en { color: var(--text-muted); }

    /* ─── Audio button ────────────────────────── */
    .audio-btn {
      background: rgba(var(--accent-rgb),0.16);
      border: 1px solid rgba(var(--accent-rgb),0.34);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.15s;
      margin-right: 8px;
    }
    .audio-btn:hover {
      background: rgba(var(--accent-rgb),0.26);
      border-color: rgba(var(--accent-rgb),0.52);
    }
    .audio-btn.active {
      background: rgba(34, 197, 94, 0.15);
      border-color: rgba(34, 197, 94, 0.3);
      color: #22c55e;
    }
    .audio-btn.active:hover {
      background: rgba(34, 197, 94, 0.25);
      border-color: rgba(34, 197, 94, 0.5);
    }
    .audio-badge {
      margin-right: 8px;
      font-size: 12px;
    }
    .audio-badge.enabled {
      color: #22c55e;
    }

    /* ─── Delete button ──────────────────────────── */
    .delete-btn {
      flex-shrink: 0;
      width: 28px; height: 28px;
      border-radius: 6px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .delete-btn:hover {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    .delete-btn svg {
      width: 14px; height: 14px;
    }

    /* ─── Delete confirmation dialog ──────────────── */
    .dialog-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .dialog {
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      border-radius: 16px;
      padding: 20px;
      max-width: 320px;
      width: 100%;
    }
    .dialog-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .dialog-icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.1);
      display: flex; align-items: center; justify-content: center;
    }
    .dialog-icon svg {
      width: 22px; height: 22px;
      color: #ef4444;
    }
    .dialog-close {
      background: none;
      border: none;
      padding: 6px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .dialog-close:hover {
      background: var(--border-subtle);
      color: var(--text-primary);
    }
    .dialog-close svg {
      width: 18px; height: 18px;
    }
    .dialog-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .dialog-video-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .dialog-text {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .dialog-actions-vertical {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dialog-btn-orange,
    .dialog-btn-red,
    .dialog-btn-cancel {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .dialog-btn-orange {
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.2);
      color: #f97316;
    }
    .dialog-btn-orange:hover {
      background: rgba(249, 115, 22, 0.2);
    }
    .dialog-btn-red {
      background: #ef4444;
      border: none;
      color: white;
    }
    .dialog-btn-red:hover {
      background: #dc2626;
    }
    .dialog-btn-cancel {
      background: var(--border-subtle);
      border: 1px solid var(--border-medium);
      color: var(--text-secondary);
    }
    .dialog-btn-cancel:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
    }
    .dialog-btn-orange:disabled,
    .dialog-btn-red:disabled,
    .dialog-btn-cancel:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-icon {
      width: 14px; height: 14px;
    }
    .btn-spinner {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid currentColor;
      border-top-color: transparent;
      animation: spin 0.7s linear infinite;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="popup.js"></script>
</body>
</html>
